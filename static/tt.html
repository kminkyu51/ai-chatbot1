
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국성서대 학사 안내 AI</title>
    <link rel="stylesheet" href="/static/cs.css">
    <script src="/static/su.js" defer></script>
</head>
<body>
<div class="app-container">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <div class="brand-icon">A</div>
                <span>한국성서대 학사 안내 AI</span>
            </div>
            <button class="icon-button close-sidebar" id="closeSidebar"
                    aria-label="사이드바 닫기">✕</button>
        </div>

        <button class="new-chat-button" id="newChatButton">
            <span class="new-chat-icon">＋</span>
            <span>새 채팅</span>
        </button>

        <div class="sidebar-section">
            <p class="section-title">학과 선택</p>
            <label for="departmentSelect" class="sr-only">학과 선택</label>
            <select id="departmentSelect" class="department-select">
                <option value="">학과를 선택하세요</option>
                <option value="data1">성서학과</option>
                <option value="data2">사회복지학과</option>
                <option value="data3">영유아보육학과</option>
                <option value="data4">간호학과</option>
                <option value="data5">AI융합학부</option>
            </select>
            <p class="sidebar-help">
                선택한 학과의 학사정보를 바탕으로 답변합니다.
            </p>
        </div>

        <!-- 데이터베이스에 저장된 대화 목록 -->
        <div class="history-section">
            <p class="section-title">최근 대화</p>
            <div id="conversationList" class="conversation-list">
                <p class="history-empty">저장된 대화를 불러오는 중...</p>
            </div>
        </div>

        <div class="sidebar-bottom">
            <div class="status-indicator"></div>
            <span>한국성서대 학사 안내 AI</span>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <header class="topbar">
            <button class="icon-button menu-button" id="menuButton"
                    aria-label="메뉴 열기">☰</button>
            <div class="mobile-brand">한국성서대 학사 안내 AI</div>
            <div class="topbar-right">
                <span class="topbar-label">학사정보 AI 도우미</span>
            </div>
        </header>

        <section class="chat-area" id="chatArea"
                 aria-label="채팅 대화">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-icon">✳</div>
                <h1>무엇을 도와드릴까요?</h1>
                <p class="welcome-description">
                    한국성서대학교 학사안내 AI입니다.<br>
                    학과를 선택하고 궁금한 학사정보를 질문해 보세요.
                </p>

                <div class="suggestion-list">
                    <button class="suggestion-card"
                            data-question="수강신청은 어떻게 하나요?">
                        <span class="suggestion-icon">▤</span>
                        <span>수강신청 방법 알려줘</span>
                        <span class="suggestion-arrow">↗</span>
                    </button>
                    <button class="suggestion-card"
                            data-question="졸업요건을 알려주세요.">
                        <span class="suggestion-icon">◇</span>
                        <span>졸업요건 알려줘</span>
                        <span class="suggestion-arrow">↗</span>
                    </button>
                    <button class="suggestion-card"
                            data-question="수강철회 기간과 방법을 알려주세요.">
                        <span class="suggestion-icon">◷</span>
                        <span>수강철회 기간 알려줘</span>
                        <span class="suggestion-arrow">↗</span>
                    </button>
                    <button class="suggestion-card"
                            data-question="학과 사무실 문의처를 알려주세요.">
                        <span class="suggestion-icon">⌕</span>
                        <span>학과 문의처 알려줘</span>
                        <span class="suggestion-arrow">↗</span>
                    </button>
                </div>
            </div>

            <div class="messages" id="messages"></div>
        </section>

        <footer class="composer-area">
            <form class="composer" id="chatForm">
                <label for="questionInput" class="sr-only">질문 입력</label>
                <textarea id="questionInput"
                          placeholder="학사정보에 대해 무엇이든 질문하세요."
                          rows="1" maxlength="2000" required></textarea>

                <div class="composer-bottom">
                    <span class="composer-hint" id="composerHint">
                        먼저 학과를 선택해 주세요.
                    </span>
                    <button type="submit" class="send-button" id="sendButton"
                            aria-label="질문 보내기" disabled>↑</button>
                </div>
            </form>

            <p class="disclaimer">
                AI 답변은 참고용입니다. 중요한 학사 일정은 학교 공식 공지를 확인하세요.
            </p>
        </footer>
    </main>
</div>
</body>
</html>
